name: Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # gh release create
    steps:
      # The runner ships JDK 21 and the Android SDK; no setup actions needed.
      - run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: Build web and sync into the shell
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          npm run build
          npx cap sync android

      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with the debug key. No release will be published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          ./gradlew --no-daemon assembleRelease

      - name: Name and verify
        id: apk
        run: |
          version=$(node -p "require('./package.json').version")
          out="kosmos-v$version.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$out"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs "$out" | tee signer.txt
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Check the release signer
        if: steps.key.outputs.signed == 'true'
        run: |
          expected=$(sed -n 's/^SHA-256 (release certificate): //p' README.md | tr -d ': ' | tr 'A-F' 'a-f')
          # apksigner prefixes lines with "Signer #1" or "V2 Signer" depending on schemes present.
          actual=$(grep -m1 -oE 'certificate SHA-256 digest: [0-9a-f]{64}' signer.txt | awk '{print $NF}')
          echo "expected $expected"; echo "actual   $actual"
          [ -n "$expected" ] && [ "$expected" = "$actual" ]

      # TODO pin to SHA (Dependabot keeps it current), as in apps-data templates
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          retention-days: 14

      # Smoke test on an emulator before anything is published: install, launch, look.
      # Uses the runner's SDK directly instead of a third-party emulator action.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start emulator
        env:
          IMAGE: system-images;android-34;google_apis;x86_64
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$sdk/sdkmanager" --licenses >/dev/null || true
          "$sdk/sdkmanager" --install platform-tools emulator "$IMAGE" >/dev/null
          # adb is not on the runner's PATH; this step and the smoke test need it.
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          # One AVD directory for both tools; by default they disagree on the runner.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | "$sdk/avdmanager" create avd -n smoke -k "$IMAGE" -d pixel_6 --force
          "$ANDROID_HOME/emulator/emulator" -list-avds
          nohup "$ANDROID_HOME/emulator/emulator" -avd smoke -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -camera-back none > emulator.log 2>&1 &
          # Bounded waits: a boot that never finishes fails here with its log, not at the job limit.
          if ! timeout 600 bash -c 'adb wait-for-device && until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 3; done'; then
            echo "::error::emulator did not boot"
            tail -n 80 emulator.log
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Smoke test
        run: scripts/android-smoke.sh "${{ steps.apk.outputs.file }}"

      # The latest screenshot also goes to the orphan branch ci-smoke (force-pushed, one commit),
      # so it can be looked at without downloading artifacts.
      - name: Publish smoke screenshot
        if: always() && github.ref == 'refs/heads/main' && hashFiles('smoke/screen.png') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=$(mktemp -d)
          cp smoke/screen.png "$dir/screen.png"
          cp smoke/logcat.txt "$dir/logcat.txt" 2>/dev/null || true
          cd "$dir"
          git init -q -b ci-smoke
          git add -A
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Smoke screenshot for $GITHUB_SHA"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-smoke

      - if: always()
        # TODO pin to SHA (Dependabot keeps it current), as in apps-data templates
        uses: actions/upload-artifact@v7
        with:
          name: android-smoke
          path: |
            smoke/
            emulator.log
          retention-days: 14

      # A version bump on main publishes itself: release when v<version> has no tag yet.
      - name: Release
        if: steps.key.outputs.signed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
          FILE: ${{ steps.apk.outputs.file }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released."
            exit 0
          fi
          gh release create "v$VERSION" "$FILE" \
            --target "$GITHUB_SHA" \
            --title "kOSMos $VERSION" \
            --generate-notes \
            --notes "Install or update with Obtainium: add https://github.com/${{ github.repository }}"
